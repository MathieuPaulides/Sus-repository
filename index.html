<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>STAXS – CO₂-besparingscalculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 24px;
      color: #111;
    }
    h1, h2, h3 {
      margin-top: 0;
    }
    nav {
      margin-bottom: 24px;
    }
    nav button {
      margin-right: 8px;
      padding: 8px 14px;
      border: none;
      cursor: pointer;
      background: #eee;
      border-radius: 6px;
    }
    nav button.active {
      background: #F24D9A;
      color: white;
    }
    .card {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 6px;
      margin-top: 4px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    th, td {
      border-bottom: 1px solid #ddd;
      padding: 6px;
      text-align: left;
    }
    .muted {
      color: #666;
      font-size: 0.9em;
    }
    .danger {
      color: #b00020;
    }
  </style>
</head>

<body>

<nav>
  <button id="btnCalc" class="active">Calculator</button>
  <button id="btnConfig">Configuratie</button>
</nav>

<div id="app"></div>

<script>
/* ==============================
   CONSTANTS
================================ */
const KG_CO2_PER_TREE = 21;
const KG_CO2_PER_GAS_DAY = 5;
const STORAGE_KEY = "staxs-co2-config";

/* ==============================
   DEFAULT DATA (FROM SCREENSHOTS)
================================ */
const DEFAULT_CONFIG = {
  materials: [
    { id: "isopreen", name: "Isopreen (band)", co2: 0.8 },
    { id: "pc", name: "PC (Lens)", co2: 6.25 },
    { id: "pvc", name: "PVC (frame)", co2: 2.4 },
    { id: "tpv", name: "TPV (frame)", co2: 0.8 }
  ],
  transports: [
    { id: "air", name: "Air Freight", co2: 0.5, default: false },
    { id: "electric", name: "Electric truck", co2: 0.05, default: false },
    { id: "ship", name: "Ship", co2: 0.01, default: false },
    { id: "train", name: "Train", co2: 0.03, default: false },
    { id: "truck", name: "Truck", co2: 0.12, default: true }
  ],
  products: [
    {
      id: "F-0300",
      name: "F-0300",
      materials: [
        { materialId: "tpv", weight: 0.0562 },
        { materialId: "pc", weight: 0.0367 },
        { materialId: "isopreen", weight: 0.0129 }
      ]
    },
    {
      id: "FS-0086",
      name: "FS-0086",
      materials: [
        { materialId: "pvc", weight: 0.0424 },
        { materialId: "pc", weight: 0.02036 },
        { materialId: "isopreen", weight: 0.00463 }
      ]
    }
  ]
};

/* ==============================
   STATE
================================ */
let state = loadState();
let page = "calc";

/* ==============================
   STORAGE
================================ */
function loadState() {
  const saved = localStorage.getItem(STORAGE_KEY);
  return saved ? JSON.parse(saved) : structuredClone(DEFAULT_CONFIG);
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ==============================
   HELPERS
================================ */
function materialById(id) {
  return state.materials.find(m => m.id === id);
}
function productSaving(product) {
  return product.materials.reduce((sum, m) => {
    return sum + (m.weight * materialById(m.materialId).co2);
  }, 0);
}
function formatKg(value) {
  return `${value.toFixed(2)} kg CO₂`;
}

/* ==============================
   RENDER
================================ */
function render() {
  document.getElementById("btnCalc").classList.toggle("active", page === "calc");
  document.getElementById("btnConfig").classList.toggle("active", page === "config");
  page === "calc" ? renderCalculator() : renderConfig();
}

/* ==============================
   CALCULATOR
================================ */
function renderCalculator() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="card">
      <h1>CO₂-besparingscalculator</h1>
      <label>Product</label>
      <select id="productSelect">
        <option value="">Selecteer product</option>
        ${state.products.map(p => `<option value="${p.id}">${p.name}</option>`).join("")}
      </select>

      <label>Aantal (stuks)</label>
      <input id="qty" type="number" min="1" />

      <label>Afstand naar STAXS (km)</label>
      <input id="distance" type="number" min="0" />

      <button style="margin-top:12px" onclick="calculate()">Bereken</button>
    </div>

    <div id="results"></div>
  `;
}

function calculate() {
  const productId = document.getElementById("productSelect").value;
  const qty = Number(document.getElementById("qty").value);
  const distance = Number(document.getElementById("distance").value || 0);

  if (!productId || qty <= 0 || distance < 0) {
    document.getElementById("results").innerHTML = `
      <div class="card danger">
        Vul een product in, kies een aantal groter dan 0 en gebruik een geldige afstand.
      </div>
    `;
    return;
  }

  const product = state.products.find(p => p.id === productId);
  const savingPerUnit = productSaving(product);
  const totalSaving = savingPerUnit * qty;

  const transport = state.transports.find(t => t.default);
  const logistics = distance * transport.co2 * qty;
  const netSaving = totalSaving - logistics;
  const trees = Math.max(netSaving, 0) / KG_CO2_PER_TREE;
  const gasDays = Math.max(netSaving, 0) / KG_CO2_PER_GAS_DAY;

  document.getElementById("results").innerHTML = `
    <div class="card">
      <h2>Resultaat</h2>
      <p><strong>Bruto CO₂-besparing:</strong> ${formatKg(totalSaving)}</p>
      ${logistics > 0 ? `<p class="muted">Transportuitstoot (${transport.name}): ${formatKg(logistics)}</p>` : ""}
      <p><strong>Netto CO₂-besparing:</strong> ${formatKg(netSaving)}</p>
      <p>${trees.toFixed(1)} bomen per jaar</p>
      <p>${gasDays.toFixed(1)} dagen gasverbruik</p>
      <p class="muted">Deze berekening is een indicatieve schatting.</p>
    </div>
  `;
}

/* ==============================
   CONFIGURATION
================================ */
function renderConfig() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="card">
      <h1>Configuratie</h1>
      <p class="muted">
        Wordt lokaal opgeslagen in je browser. Wijzigingen worden niet gedeeld.
      </p>

      <h3>Materialen</h3>
      ${state.materials.map((m, i) => `
        <label>${m.name} (kg CO₂ / kg)</label>
        <input type="number" value="${m.co2}"
          onchange="state.materials[${i}].co2=Number(this.value); saveState()" />
      `).join("")}

      <button class="danger" style="margin-top:12px"
        onclick="localStorage.removeItem('${STORAGE_KEY}'); location.reload()">
        Herstel standaardwaarden
      </button>
    </div>
  `;
}

/* ==============================
   NAVIGATION
================================ */
document.getElementById("btnCalc").onclick = () => { page = "calc"; render(); };
document.getElementById("btnConfig").onclick = () => { page = "config"; render(); };

render();
</script>

</body>
</html>
